name: Deploy Docs

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Clean Install
        run: npm ci

      - name: Build Docs
        run: npx nx run ngx-fast-svg-docs:build:production --base-href /ngx-fast-svg/

      # Every route is prerendered. Unknown URLs (for example an icon count that
      # isn't prerendered) get the client-side app through GitHub Pages' 404.html.
      - name: Add SPA fallback
        run: |
          cp dist/packages/ngx-fast-svg-docs/browser/index.csr.html dist/packages/ngx-fast-svg-docs/browser/404.html
          touch dist/packages/ngx-fast-svg-docs/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/packages/ngx-fast-svg-docs/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
