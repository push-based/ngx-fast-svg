name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version or semver keyword (e.g. 22.0.0, major). Leave empty to derive it from conventional commits.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version and release
    # This line is critical for copy paste issues
    if: github.repository == 'push-based/ngx-fast-svg'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Authenticate as "PushBased Bot" GitHub App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      - name: Fetch GitHub App's user ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Configure Git user
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
      - name: Clone the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx nx run ngx-fast-lib:build
      - name: Test
        run: npx nx run ngx-fast-lib:test
      - name: Version, release and generate changelog
        run: npx nx release $VERSION --skip-publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ inputs.version }}
