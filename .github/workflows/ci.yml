name: ci

on:
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: install
        run: npm ci
      - name: build
        run: npm run nx -- affected:build --base=origin/main --head=HEAD
      - name: test
        run: npm run nx -- affected:test --base=origin/main --head=HEAD
      # Not affected-gated on purpose: a dependency bump moves these numbers
      # without touching a single source file of ours.
      - name: check bundle stats
        run: npm run bundle-stats:check
